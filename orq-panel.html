<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestador IA</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#14171c;--muted:#5d6673;--line:#e3e6eb;--soft:#eef0f3;
  --accent:#2f6fde;--ok:#16834a;--ok-bg:#e3f4ea;--warn:#a3620a;--warn-bg:#fcf0d9;--bad:#c2372f;--bad-bg:#fbe5e3;
  --info-bg:#e6eefc;--shadow:0 1px 2px rgba(20,23,28,.06),0 2px 8px rgba(20,23,28,.04);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a20;--ink:#e8ebf0;--muted:#8d96a3;--line:#262b33;--soft:#1e222a;
  --accent:#6b9cf5;--ok:#4cc584;--ok-bg:#15291f;--warn:#e9a84a;--warn-bg:#2c2312;--bad:#f07068;--bad-bg:#2e1717;--info-bg:#18233a;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a20;--ink:#e8ebf0;--muted:#8d96a3;--line:#262b33;--soft:#1e222a;
  --accent:#6b9cf5;--ok:#4cc584;--ok-bg:#15291f;--warn:#e9a84a;--warn-bg:#2c2312;--bad:#f07068;--bad-bg:#2e1717;--info-bg:#18233a;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--accent)}
.pill.run i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.small{font-size:13px;padding:4px 10px}
button:disabled{opacity:.5;cursor:default}
main{max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--soft);color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px;letter-spacing:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:980px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.big{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:2px 0 4px}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:13px}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.meter{margin:10px 0 14px}
.meter .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.meter .top b{font-size:20px}
.track{position:relative;height:10px;background:var(--soft);border-radius:999px;overflow:visible}
.fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.mark{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.55;border-radius:1px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list li:first-child{border-top:0;padding-top:2px}
.list .main{flex:1;min-width:0}
.title{font-weight:600}
.tid{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.info{background:var(--info-bg);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
textarea,input[type=text],input[type=number]{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px}
textarea{min-height:64px;resize:vertical}
.q{background:var(--soft);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:12px;font:12.5px/1.5 var(--mono);margin:10px 0 0;max-height:420px;overflow:auto}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;padding:20px}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .act{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.foot{grid-column:span 12;color:var(--muted);font-size:12px;text-align:center;padding:4px 0 24px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Orquestador IA</h1>
  <span id="st" class="pill"><i></i>Cargando…</span>
  <span class="sp"></span>
  <span id="upd" class="muted" style="font-size:13px"></span>
  <button id="theme" class="ghost" title="Tema claro u oscuro" aria-label="Cambiar tema">◐</button>
  <button id="pauseBtn">…</button>
</div></header>

<main>
  <section class="card c5"><h2>Ahora</h2><div id="now"></div></section>
  <section class="card c7"><h2>Uso de Claude</h2><div id="usage"></div></section>
  <section class="card c6"><h2>Preguntas pendientes <span class="n" id="nq">0</span></h2><div id="questions"></div></section>
  <section class="card c6"><h2>Cola <span class="n" id="nc">0</span></h2><div id="queue"></div></section>
  <section class="card c12"><h2>Últimas ejecuciones</h2><div class="tw" id="runs"></div></section>
  <section class="card c6"><h2>Integración a main pendiente</h2><div id="integ"></div></section>
  <section class="card c6"><h2>Permiso web por tarjeta</h2><div id="web"></div></section>
  <section class="card c6"><h2>LaunchAgents</h2><div id="agents"></div></section>
  <section class="card c6"><h2>Resumen en bruto</h2><div id="raw"></div></section>
  <div class="foot">Solo lectura salvo las acciones con confirmación · cada acción queda en <span class="mono">logs/orq-panel.log</span></div>
</main>

<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="box">
  <h3 id="dlgT"></h3><p id="dlgP"></p>
  <div class="act"><button id="dlgNo">Cancelar</button><button id="dlgYes" class="primary">Confirmar</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, drafts = {};

// theme
const root = document.documentElement;
try { const t = localStorage.getItem('orq-theme'); if (t) root.dataset.theme = t; } catch (_) {}
$('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('orq-theme', root.dataset.theme); } catch (_) {}
};

function dur(s) {
  s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`;
}
function ago(t) { return t ? dur(Date.now() / 1000 - t) : '—'; }
function when(t) {
  const d = new Date(t * 1000), today = new Date();
  const hm = d.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
  return d.toDateString() === today.toDateString() ? hm : d.toLocaleDateString('es-ES', {day: 'numeric', month: 'short'}) + ' ' + hm;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function confirmBox(title, text, yes = 'Confirmar', danger = false) {
  return new Promise((ok) => {
    $('dlgT').textContent = title; $('dlgP').textContent = text; $('dlgYes').textContent = yes;
    $('dlgYes').className = danger ? 'danger' : 'primary'; $('dlg').classList.add('on'); $('dlgYes').focus();
    const done = (v) => { $('dlg').classList.remove('on'); $('dlgYes').onclick = $('dlgNo').onclick = null; ok(v); };
    $('dlgYes').onclick = () => done(true); $('dlgNo').onclick = () => done(false);
  });
}
async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'content-type': 'application/json', 'X-Orq-Panel': '1'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  if (j.state) render(j.state);
  return j;
}

const RES = {'ia·hecho': ['Hecho', 'ok'], 'ia·plan-listo': ['Plan listo', 'info'], 'ia·cambios': ['Cambios', 'warn'], 'ia·fallo': ['Fallo', 'bad'], 'ia·pregunta': ['Pregunta', 'warn'], 'review_deferred': ['Revisión aplazada', 'warn']};
const MODE = {exec: 'Ejecutar', plan: 'Plan'};

function render(s) {
  S = s;
  const st = $('st');
  if (s.paused) { st.className = 'pill warn'; st.innerHTML = '<i></i>En pausa'; }
  else if (s.running) { st.className = 'pill info run'; st.innerHTML = '<i></i>Trabajando'; }
  else { st.className = 'pill ok'; st.innerHTML = '<i></i>Activo, sin tarea'; }
  $('pauseBtn').textContent = s.paused ? 'Reanudar' : 'Pausar';
  $('pauseBtn').className = s.paused ? 'primary' : '';
  $('upd').textContent = 'Actualizado ' + new Date(s.now * 1000).toLocaleTimeString('es-ES');

  // now
  const r = s.running;
  $('now').innerHTML = r ? `
    <div class="row"><span class="tid">t${r.id}</span><span class="tag info">${esc(MODE[r.mode] || r.mode)}</span><span class="muted">${esc(r.board)}</span></div>
    <div class="big">${esc(r.title)}</div>
    <div class="row muted"><span>Lleva <b style="color:var(--ink)">${dur(r.elapsed)}</b></span><span>desde las ${when(r.start)}</span>
    ${r.steps ? `<span>${r.steps} pasos · $${r.cost.toFixed(2)}</span>` : ''}</div>
    ${s.paused ? '<p class="muted" style="margin:10px 0 0">La pausa no la corta: al terminar no arrancará otra.</p>' : ''}`
    : `<div class="big">${s.paused ? 'En pausa' : 'Sin tarea en curso'}</div>
       <div class="muted">${s.paused ? 'Pausado desde las ' + when(s.paused_since) + '. No arranca ninguna tarjeta nueva ni el supervisor.' : 'El despachador mira la cola cada minuto.'}</div>`;

  // usage
  const u = s.usage || {};
  const meter = (label, v, allowed, reset) => {
    const cls = v >= 90 ? 'bad' : v >= 70 ? 'warn' : '';
    return `<div class="meter"><div class="top"><span>${label}</span><span><b>${v ?? '?'}%</b> <span class="muted">· reinicia ${esc(reset || '—')}</span></span></div>
      <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, v || 0)}%"></div>${allowed != null ? `<div class="mark" title="Permitido ahora: ${allowed}%" style="left:${Math.min(100, allowed)}%"></div>` : ''}</div>
      ${allowed != null ? `<div class="muted" style="font-size:12px;margin-top:5px">Ritmo permitido ahora: ${allowed}%</div>` : ''}</div>`;
  };
  const es = (t) => String(t).replace(/^no cooldown$/, 'sin cooldown').replace(/^exhausted$/, 'agotado').replace(/^ok$/i, 'disponible').replace(/cooldown until/i, 'en cooldown hasta');
  const cd = (txt) => !txt ? '<span class="tag">?</span>' : /no cooldown|^ok|available/i.test(txt) ? `<span class="tag ok">${esc(es(txt))}</span>` : `<span class="tag warn">${esc(es(txt))}</span>`;
  const day = (r) => String(r || '—').replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/, (d) => ({Mon:'lun',Tue:'mar',Wed:'mié',Thu:'jue',Fri:'vie',Sat:'sáb',Sun:'dom'})[d]);
  $('usage').innerHTML = meter('Ventana de 5 h', u.h5, u.h5_allowed, u.h5_reset) + meter('Semana', u.d7, u.d7_allowed, day(u.d7_reset)) +
    `<div class="grid2"><div><span class="muted">Claude</span><br>${cd(u.claude)}</div><div><span class="muted">OpenCode</span><br>${cd(u.opencode)}</div></div>
     <p class="muted" style="margin:12px 0 0;font-size:13px">Decisión: ${esc((u.decision || '—').replace('OK to start Claude', 'puede arrancar Claude'))} · datos de hace ${ago(s.usage_at)}</p>`;

  // questions
  $('nq').textContent = s.questions.length;
  $('questions').innerHTML = s.questions.length ? '<ul class="list">' + s.questions.map((q) => `
    <li><div class="main">
      <div class="row"><span class="tid">t${q.id}</span><span class="muted">${esc(q.board)}</span>${q.ai ? `<span class="tag">${esc(q.ai)}</span>` : ''}</div>
      <div class="title">${esc(q.title)}</div>
      <div class="q">${esc(q.text || '(sin texto de pregunta)')}</div>
      <textarea id="a${q.id}" placeholder="Tu respuesta…">${esc(drafts[q.id] || '')}</textarea>
      <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="primary small" data-answer="${q.id}">Responder y continuar</button></div>
    </div></li>`).join('') + '</ul>' : '<div class="empty">No hay preguntas esperando.</div>';

  // queue: inbox queued + dry-run reasons
  const why = {}; (s.dry || []).forEach((d) => { if (d.id) why[d.id] = d; });
  const warns = (s.dry || []).filter((d) => !d.id);
  $('nc').textContent = s.queue.length;
  $('queue').innerHTML = (s.queue.length ? '<ul class="list">' + s.queue.map((t) => {
    const d = why[t.id]; const block = d && d.kind === 'espera';
    return `<li><div class="main"><div class="row"><span class="tid">t${t.id}</span><span class="muted">${esc(t.board)}</span>
      ${t.tags.filter((x) => x.startsWith('ia·')).map((x) => `<span class="tag">${esc(x)}</span>`).join('')}${t.ai ? `<span class="tag">${esc(t.ai)}</span>` : ''}</div>
      <div class="title">${esc(t.title)}</div>
      ${d ? `<div style="margin-top:4px"><span class="tag ${block ? 'warn' : 'ok'}">${block ? 'Bloqueada' : 'Lista'}</span> <span class="muted">${esc(d.text)}</span></div>` : ''}</div></li>`;
  }).join('') + '</ul>' : '<div class="empty">Cola vacía.</div>') +
    (warns.length ? `<p class="muted" style="font-size:13px;margin:10px 0 0">${warns.map((w) => esc(w.board + ': ' + w.text)).join('<br>')}</p>` : '') +
    `<p class="muted" style="font-size:12px;margin:8px 0 0">Bloqueos de <span class="mono">--dry-run</span> de hace ${ago(s.dry_at)}${s.lock ? ' (con una tarea en curso se conserva el último)' : ''}.</p>`;

  // runs
  const rows = s.runs.slice(0, 15);
  $('runs').innerHTML = rows.length ? `<table><thead><tr><th>Tarjeta</th><th>Proyecto</th><th>Modo</th><th>Resultado</th><th class="num">Duración</th><th class="num">Coste</th><th class="num">Inicio</th></tr></thead><tbody>` +
    rows.map((r) => {
      const res = r.end ? (RES[r.result] || [r.result || (r.ok ? 'OK' : 'Fallo'), r.ok ? 'ok' : 'bad']) : (s.running && s.running.id === r.id && s.running.start === r.start ? ['En curso', 'info'] : ['Sin cierre', '']);
      return `<tr><td><span class="tid">t${r.id}</span> ${esc(r.title)}</td><td class="muted">${esc(r.board)}</td><td>${esc(MODE[r.mode] || r.mode)}${r.runner ? `<div class="muted" style="font-size:12px">${esc(r.runner)}</div>` : ''}</td>
        <td><span class="tag ${res[1]}">${esc(res[0])}</span></td><td class="num">${r.secs != null ? dur(r.secs) : '—'}</td><td class="num">${r.cost ? '$' + r.cost.toFixed(2) : '—'}</td><td class="num muted">${when(r.start)}</td></tr>`;
    }).join('') + '</tbody></table>' : '<div class="empty">Sin ejecuciones en el log.</div>';

  // integrations
  const jobs = s.jobs || {};
  $('integ').innerHTML = s.integrations.length ? '<ul class="list">' + s.integrations.map((i) => {
    const j = jobs[i.repo + ':' + i.branch];
    return `<li><div class="main"><div class="row"><span class="tid">t${i.id}</span><span class="mono muted">${esc(i.repo)} · ${esc(i.branch)}</span><span class="muted" style="font-size:12px">${when(i.at)}</span></div>
      <div class="title">${esc(i.title)}</div><div class="muted" style="font-size:13px">${esc(i.text)}</div>
      ${j ? `<div style="margin-top:6px"><span class="tag ${j.state === 'ok' ? 'ok' : j.state === 'fallo' ? 'bad' : 'info'}">Reintento: ${esc(j.state)}</span>${j.out ? `<pre>${esc(j.out)}</pre>` : ''}</div>` : ''}</div>
      ${i.allowed ? `<button class="small" data-integ="${esc(i.repo)}|${esc(i.branch)}" ${j && j.state === 'corriendo' ? 'disabled' : ''}>Reintentar</button>` : ''}</li>`;
  }).join('') + '</ul>' : '<div class="empty">Nada pendiente de integrar (últimos 14 días).</div>';

  // web
  $('web').innerHTML = (s.web.length ? '<ul class="list">' + s.web.map((w) => `<li><div class="main"><span class="tid">t${w.id}</span> ${esc(w.title || '')}</div>
    <button class="small" data-web-off="${w.id}">Quitar</button></li>`).join('') + '</ul>' : '<div class="empty">Ninguna tarjeta con permiso web en ejecución.</div>') +
    `<div class="row" style="margin-top:12px;flex-wrap:nowrap"><input type="number" id="webId" placeholder="Id de tarjeta, p. ej. 441" min="1" style="flex:1"><button class="small" id="webAdd">Conceder web</button></div>
     <p class="muted" style="font-size:12px;margin:8px 0 0">Los planes siempre pueden usar la web; esto lo abre también a la ejecución de esa tarjeta (<span class="mono">web-tasks.txt</span>).</p>`;

  // agents
  const nice = {'com.example.taskview-ai': 'Despachador (cada 60 s)', 'com.example.taskview-supervisor': 'Supervisor (cada 15 min)', 'com.example.taskview-orq-panel': 'Este panel'};
  $('agents').innerHTML = '<table><tbody>' + s.agents.map((a) => {
    const [txt, cls] = !a.loaded ? ['No cargado', 'bad'] : a.pid ? ['En marcha', 'info'] : a.last_exit === '0' ? ['Listo', 'ok'] : ['Salida ' + a.last_exit, 'warn'];
    return `<tr><td><div>${esc(nice[a.label] || a.label.replace('com.example.taskview-', ''))}</div><div class="mono muted" style="font-size:11.5px">${esc(a.label)}</div></td>
      <td class="num">${a.pid ? `<span class="mono muted">pid ${a.pid}</span> ` : ''}<span class="tag ${cls}">${esc(txt)}</span></td></tr>`;
  }).join('') + '</tbody></table>';

  $('raw').innerHTML = `<details><summary>Salida de <span class="mono">estado-orquestador</span> y uso</summary><pre>${esc(s.estado || '')}</pre><pre>${esc((s.usage || {}).raw || '')}</pre></details>`;
}

document.addEventListener('input', (e) => { if (e.target.id && e.target.id[0] === 'a') drafts[e.target.id.slice(1)] = e.target.value; });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.id === 'pauseBtn') {
      const on = !S.paused;
      if (!await confirmBox(on ? '¿Pausar el orquestador?' : '¿Reanudar el orquestador?',
        on ? 'No arrancará ninguna tarjeta nueva ni el supervisor. Si hay una tarea en curso, termina normalmente.' : 'El despachador volverá a coger tarjetas de la cola en el próximo minuto.',
        on ? 'Pausar' : 'Reanudar', on)) return;
      await post('/api/pause', {on}); toast(on ? 'Orquestador en pausa' : 'Orquestador reanudado');
    } else if (b.dataset.answer) {
      const id = +b.dataset.answer, text = ($('a' + id).value || '').trim();
      if (!text) return toast('Escribe una respuesta');
      if (!await confirmBox(`¿Responder a t${id}?`, 'Se añade «RESPUESTA: …» a la nota y la etiqueta ia·continuar; el despachador la retomará.', 'Enviar')) return;
      b.disabled = true; await post('/api/answer', {id, text}); delete drafts[id]; toast(`Respuesta enviada a t${id}`);
    } else if (b.dataset.integ) {
      const [repo, branch] = b.dataset.integ.split('|');
      if (!await confirmBox('¿Reintentar la integración?', `Mergea ${branch} en main de ${repo}, pasa los tests y hace push normal. Si hay una tarjeta en curso, se rechaza sin tocar nada.`, 'Reintentar')) return;
      await post('/api/integrate', {repo, branch}); toast('Reintento lanzado');
    } else if (b.dataset.webOff) {
      const id = +b.dataset.webOff;
      if (!await confirmBox(`¿Quitar la web a t${id}?`, 'Su próxima ejecución ya no podrá buscar ni leer páginas web.', 'Quitar', true)) return;
      await post('/api/web', {id, on: false}); toast(`Web retirada a t${id}`);
    } else if (b.id === 'webAdd') {
      const id = parseInt($('webId').value, 10); if (!id) return toast('Pon el id de la tarjeta');
      if (!await confirmBox(`¿Conceder la web a t${id}?`, 'Su ejecución podrá usar WebSearch y WebFetch.', 'Conceder')) return;
      await post('/api/web', {id, on: true}); toast(`Web concedida a t${id}`);
    }
  } catch (err) { toast('Error: ' + err.message); b.disabled = false; }
});

async function load() {
  try { const r = await fetch('/api/state'); if (r.ok) render(await r.json()); else throw 0; }
  catch (_) { $('st').className = 'pill bad'; $('st').innerHTML = '<i></i>Sin conexión con el panel'; }
}
load(); setInterval(() => { if (!$('dlg').classList.contains('on') && !document.activeElement?.matches('textarea,input')) load(); }, 15000);
</script>
</body>
